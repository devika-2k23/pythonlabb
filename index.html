<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Lab — Learn, Code, Build</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Python Lab <small>Learn, Code, Build</small></h1>
  <select id="topic" aria-label="Topic"></select>
  <div class="xp"><b id="level"></b><div class="bar"><i id="xpfill"></i></div><span id="xptext"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="lessons.js"></script>
<script src="progress.js"></script>
<script src="python-runner.js"></script>
<script src="app.js"></script>

</html>
